name: Backend & Runner CI
on:
  push:
    branches: [main]
    paths: ["backend/**", "runner/**", "infra/**", ".github/workflows/backend-ci.yml", "pyproject.toml"]
  pull_request:
    paths: ["backend/**", "runner/**", "infra/**", ".github/workflows/backend-ci.yml", "pyproject.toml"]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:////tmp/devforge-migration-test.db
      - run: ruff check backend runner
      - run: pytest --cov=app --cov-report=term-missing
        env:
          PYTHONPATH: backend:.
