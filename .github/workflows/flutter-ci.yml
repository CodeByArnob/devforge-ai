name: Flutter Client CI
on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/flutter-ci.yml"]
permissions:
  contents: read
jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.x"
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: client
      - name: Analyze code
        run: flutter analyze
        working-directory: client
      - name: Run widget & unit tests
        run: flutter test
        working-directory: client
