name: Flutter Client CI
on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/flutter-ci.yml"]
permissions:
  contents: read
jobs:
  flutter-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: client
      - name: Analyze code
        run: flutter analyze
        working-directory: client
      - name: Run widget & unit tests
        run: flutter test
        working-directory: client
      - name: Configure Android SDK command-line tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
      - name: Install pinned Android NDK
        run: "$SDKMANAGER" --install "ndk;27.0.12077973"
      - name: Build release APK
        run: flutter build apk --release
        working-directory: client
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: devforge-ai-android-release-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
