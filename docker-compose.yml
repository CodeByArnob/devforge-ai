services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://devforge:devforge_local_only@db:5432/devforge
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8080"]'
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: devforge
      POSTGRES_USER: devforge
      POSTGRES_PASSWORD: devforge_local_only
    volumes: [devforge-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devforge -d devforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  devforge-postgres:
