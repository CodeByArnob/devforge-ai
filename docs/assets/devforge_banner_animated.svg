<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#09101D" />
    </linearGradient>

    <linearGradient id="cyanMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.05); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .pulsing-border {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .floating-orb {
      animation: floatOrb 6s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 2.5s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGradient)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="220" cy="180" r="160" fill="#38BDF8" opacity="0.12" filter="url(#glow)" class="floating-orb" />
  <circle cx="980" cy="220" r="180" fill="#34D399" opacity="0.10" filter="url(#glow)" class="floating-orb" style="animation-delay: -3s;" />
  <circle cx="600" cy="350" r="120" fill="#6366F1" opacity="0.08" filter="url(#glow)" />

  <!-- Outer Animated Border -->
  <rect x="3" y="3" width="1194" height="414" rx="22" fill="none" stroke="url(#borderGlow)" stroke-width="2" class="pulsing-border" />

  <!-- Grid Blueprint Lines -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Circuit Streaming Lines -->
  <path d="M 100 210 L 320 210 L 360 260 L 520 260" fill="none" stroke="#38BDF8" stroke-width="2" class="stream-line" opacity="0.4" />
  <path d="M 1100 210 L 880 210 L 840 160 L 680 160" fill="none" stroke="#34D399" stroke-width="2" class="stream-line" opacity="0.4" />

  <!-- Badge Top Center -->
  <g transform="translate(440, 40)">
    <rect width="320" height="36" rx="18" fill="#121A29" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="24" cy="18" r="5" fill="#34D399" class="pulsing-border" />
    <text x="38" y="23" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.2">DEVFORGE AI · PRODUCTION RELEASE</text>
  </g>

  <!-- DevForge Logo Icon on Left -->
  <g transform="translate(110, 115)">
    <!-- Rounded Box -->
    <rect width="170" height="170" rx="36" fill="#121A29" stroke="#1E293B" stroke-width="2" filter="url(#glow)" />
    <rect width="170" height="170" rx="36" fill="none" stroke="url(#cyanMint)" stroke-width="2" class="pulsing-border" />
    
    <!-- Lightning Bolt & Code Icon -->
    <polygon points="95,35 60,95 88,95 72,145 125,85 98,85" fill="url(#cyanMint)" />
    <path d="M 42 75 L 28 95 L 42 115" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 128 75 L 142 95 L 128 115" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="130,42 135,32 140,42 150,47 140,52 135,62 130,52 120,47" fill="#FFFFFF" />
  </g>

  <!-- Typography Content -->
  <g transform="translate(330, 130)">
    <!-- Main Headline -->
    <text x="0" y="46" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
      DevForge <tspan fill="url(#cyanMint)">AI</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="88" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94A3B8">
      Autonomous Multi-Language AI Coding &amp; Mobile Build Studio
    </text>

    <!-- Bullets -->
    <text x="0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#CBD5E1">
      <tspan fill="#34D399">✦</tspan> 8-Role Specialist Agent Team  ·  <tspan fill="#38BDF8">✦</tspan> Hardened Podman Sandboxes  ·  <tspan fill="#818CF8">✦</tspan> 1-Tap Mobile Builds
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 155)">
      <!-- Badge 1: Flutter Client -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#121A29" stroke="#1E293B" />
      <text x="16" y="20" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700" fill="#38BDF8">📱 Flutter Client</text>
      
      <!-- Badge 2: Local Qwen -->
      <rect x="142" y="0" width="155" height="32" rx="8" fill="#121A29" stroke="#1E293B" />
      <text x="158" y="20" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700" fill="#34D399">⚡ Offline GGUF/Qwen</text>

      <!-- Badge 3: GitHub Actions -->
      <rect x="309" y="0" width="160" height="32" rx="8" fill="#121A29" stroke="#1E293B" />
      <text x="325" y="20" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700" fill="#818CF8">🚀 Cloud CI Dispatch</text>

      <!-- Badge 4: Universal APK -->
      <rect x="481" y="0" width="150" height="32" rx="8" fill="#121A29" stroke="#1E293B" />
      <text x="497" y="20" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700" fill="#F43F5E">📦 Android v1.0.0 APK</text>
    </g>
  </g>
</svg>