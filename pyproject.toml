[project]
name = "devforge-ai-backend"
version = "0.3.0"
description = "Secure API, OpenRouter gateway and agent planning runtime for DevForge AI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2.1,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.7,<1.0"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
